<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬投資ログ（ライト）</title>
<style>
  /* ── リセット & 変数 ───────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F0EDE6;
    --surface:  #FFFFFF;
    --card:     #FFFFFF;
    --gold:     #1A2F45;
    --gold-dim: #0D1B2A;
    --text:     #1C2B3A;
    --muted:    #7A8FA0;
    --win:      #1A7A4A;
    --lose:     #C0392B;
    --border:   rgba(26,47,69,0.15);
    --radius:   10px;
    --font:     -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── ヘッダー ───────────────────────────────── */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-header .logo {
    width: 32px; height: 32px;
    background: var(--gold);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .site-header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  .site-header .sub {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 1px;
  }

  /* ── タブ ──────────────────────────────────── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 67px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 13px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    letter-spacing: 0.03em;
  }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ── コンテンツ ─────────────────────────────── */
  .pane { display: none; padding: 20px 16px; }
  .pane.active { display: block; }

  /* ── フォームカード ─────────────────────────── */
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .form-card h2 {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  label.field-label {
    display: block;
    font-size: 0.73rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }

  input[type=text], select, textarea {
    width: 100%;
    background: #F7F5F1;
    border: 1px solid rgba(26,47,69,0.18);
    border-radius: 7px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font);
    padding: 11px 12px;
    outline: none;
    transition: border-color .2s;
    appearance: none;
    -webkit-appearance: none;
  }
  input[type=text]:focus, select:focus, textarea:focus {
    border-color: var(--gold);
  }
  textarea { resize: vertical; min-height: 70px; }

  /* ── 馬券種チップ ───────────────────────────── */
  .bet-chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .bet-chip { width: 100%; }
  .bet-chip input { display: none; }
  .bet-chip label {
    display: block;
    width: 100%;
    padding: 9px 4px;
    border: 1px solid rgba(26,47,69,0.2);
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
    user-select: none;
    text-align: center;
    white-space: nowrap;
  }
  .bet-chip input:checked + label {
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  /* ── 結果ラジオ ─────────────────────────────── */
  .result-radio { display: flex; gap: 10px; }
  .result-radio input { display: none; }
  .result-radio label {
    flex: 1;
    text-align: center;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    border: 1px solid rgba(26,47,69,0.2);
    color: var(--muted);
  }
  .result-radio .r-win + label { border-color: rgba(26,122,74,0.4); }
  .result-radio .r-lose + label { border-color: rgba(192,57,43,0.4); }
  .result-radio .r-win:checked + label { background: var(--win); color: #fff; border-color: var(--win); }
  .result-radio .r-lose:checked + label { background: var(--lose); color: #fff; border-color: var(--lose); }

  /* ── 保存ボタン ─────────────────────────────── */
  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--gold);
    color: #FFFFFF;
    font-size: 0.95rem;
    font-weight: 800;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }
  .btn-primary:active { transform: scale(0.98); background: var(--gold-dim); }

  /* ── サマリー ───────────────────────────────── */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
  }
  .summary-box .val {
    font-size: 1.5rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .summary-box .lbl {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .val-total { color: var(--text); }
  .val-win   { color: var(--win); }
  .val-rate  { color: var(--gold); }

  /* ── 履歴リスト ─────────────────────────────── */
  .history-list { display: flex; flex-direction: column; gap: 10px; }

  .h-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    box-shadow: 0 1px 4px rgba(26,47,69,0.08);
  }

  /* 馬券風ミシン目ライン — 芝色 */
  .h-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: repeating-linear-gradient(
      to bottom,
      #2D6A4F 0, #2D6A4F 6px,
      transparent 6px, transparent 10px
    );
  }

  .h-card-inner { padding: 14px 14px 14px 20px; }

  .h-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .h-track {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
  }
  .h-dist {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
    margin-top: 2px;
  }

  .h-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 12px;
    letter-spacing: 0.04em;
  }
  .badge-bet {
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.4);
    color: var(--gold);
  }
  .badge-win  { background: rgba(46,204,113,0.15); border: 1px solid var(--win);  color: var(--win); }
  .badge-lose { background: rgba(231,76,60,0.15);  border: 1px solid var(--lose); color: var(--lose); }

  .h-horse-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .h-horse-name {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--text);
  }
  .h-finishing {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 10px;
    background: rgba(26,47,69,0.08);
    color: var(--gold);
    border: 1px solid rgba(26,47,69,0.15);
  }

  .h-reason {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .h-failure {
    font-size: 0.78rem;
    color: rgba(231,76,60,0.8);
    line-height: 1.5;
  }
  .h-failure:empty { display: none; }

  /* アクションボタン行 */
  .h-actions {
    display: flex;
    border-top: 1px solid rgba(26,47,69,0.08);
  }
  .h-action-btn {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: color .2s, background .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .h-action-btn:hover { background: rgba(26,47,69,0.05); }
  .h-action-btn.edit:hover { color: var(--gold); }
  .h-action-btn.del:hover  { color: var(--lose); }
  .h-action-sep { width: 1px; background: rgba(26,47,69,0.08); }

  /* 空リスト */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }

  /* ── モーダル ───────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #F7F5F1;
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 500px;
    padding: 24px 20px 36px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-header h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
  }

  /* 削除確認モーダル */
  .confirm-modal {
    background: #FFFFFF;
    border: 1px solid rgba(192,57,43,0.35);
    border-radius: 12px;
    padding: 24px 20px;
    width: calc(100% - 32px);
    max-width: 380px;
    text-align: center;
  }
  .confirm-modal h3 { font-size: 1rem; margin-bottom: 10px; }
  .confirm-modal p { font-size: 0.83rem; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .confirm-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 12px;
    background: transparent;
    border: 1px solid rgba(26,47,69,0.25);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-danger {
    flex: 1; padding: 12px;
    background: var(--lose);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }

  .confirm-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .confirm-overlay.open { display: flex; }

  /* セレクト矢印装飾 */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<!-- ヘッダー -->
<header class="site-header">
  <div class="logo">🏇</div>
  <div>
    <h1>競馬投資ログ</h1>
    <div class="sub">KEIBA INVESTMENT TRACKER</div>
  </div>
</header>

<!-- タブ -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('record')">記録する</button>
  <button class="tab-btn" onclick="switchTab('history')">履歴 <span id="count-badge"></span></button>
</div>

<!-- 記録パネル -->
<div class="pane active" id="pane-record">
  <div class="form-card">
    <h2>レース情報</h2>
    <div class="row2">
      <div class="field">
        <label class="field-label">競馬場</label>
        <div class="select-wrap">
          <select id="track">
            <option>東京</option><option>中山</option><option>京都</option><option>阪神</option>
            <option>中京</option><option>小倉</option><option>新潟</option><option>福島</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">距離</label>
        <div class="select-wrap">
          <select id="distance">
            <optgroup label="芝">
              <option>芝1000m</option><option>芝1200m</option><option>芝1400m</option>
              <option>芝1500m</option><option>芝1600m</option><option>芝1700m</option>
              <option>芝1800m</option><option>芝2000m</option><option>芝2200m</option>
              <option>芝2400m</option><option>芝2500m</option><option>芝2600m</option>
              <option>芝3000m</option><option>芝3200m</option><option>芝3400m</option>
              <option>芝3600m</option>
            </optgroup>
            <optgroup label="ダート">
              <option>ダ1000m</option><option>ダ1150m</option><option>ダ1200m</option>
              <option>ダ1300m</option><option>ダ1400m</option><option>ダ1600m</option>
              <option>ダ1700m</option><option>ダ1800m</option><option>ダ1900m</option>
              <option>ダ2000m</option><option>ダ2100m</option><option>ダ2400m</option>
              <option>ダ2500m</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">馬券種</label>
      <div class="bet-chips">
        <div class="bet-chip"><input type="checkbox" id="c-tan"><label for="c-tan">単勝</label></div>
        <div class="bet-chip"><input type="checkbox" id="c-fuku"><label for="c-fuku">複勝</label></div>
        <div class="bet-chip"><input type="checkbox" id="c-wide"><label for="c-wide">ワイド</label></div>
        <div class="bet-chip"><input type="checkbox" id="c-uma"><label for="c-uma">馬連</label></div>
        <div class="bet-chip"><input type="checkbox" id="c-sanren"><label for="c-sanren">三連複</label></div>
        <div class="bet-chip"><input type="checkbox" id="c-santan"><label for="c-santan">三連単</label></div>
      </div>
    </div>
  </div>

  <div class="form-card">
    <h2>予想</h2>
    <div class="field">
      <label class="field-label">馬名</label>
      <input type="text" id="horse" placeholder="例：イクイノックス">
    </div>
    <div class="field">
      <label class="field-label">購入根拠</label>
      <textarea id="reason" rows="2" placeholder="なぜ買うかを記録…"></textarea>
    </div>
  </div>

  <div class="form-card">
    <h2>結果</h2>
    <div class="field">
      <label class="field-label">的中 / 不的中</label>
      <div class="result-radio">
        <input type="radio" name="result" id="r-win" class="r-win" value="的中" checked>
        <label for="r-win">✓ 的中</label>
        <input type="radio" name="result" id="r-lose" class="r-lose" value="不的中">
        <label for="r-lose">✗ 不的中</label>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label class="field-label">着順</label>
        <div class="select-wrap">
          <select id="finishing">
            <option value="">—</option>
            <option>1着</option><option>2着</option><option>3着</option>
            <option>4着</option><option>5着</option><option>6着</option>
            <option>7着</option><option>8着</option><option>9着</option>
            <option>10着</option><option>11着以下</option><option>中止・除外</option>
          </select>
        </div>
      </div>
      <div class="field" style="visibility:hidden"></div>
    </div>
    <div class="field">
      <label class="field-label">敗因</label>
      <textarea id="failure" rows="2" placeholder="外れた場合の分析（任意）"></textarea>
    </div>
    <button class="btn-primary" onclick="saveRecord()">記録を保存する</button>
  </div>
</div>

<!-- 履歴パネル -->
<div class="pane" id="pane-history">
  <div class="summary-grid">
    <div class="summary-box">
      <div class="val val-total" id="s-total">0</div>
      <div class="lbl">総記録</div>
    </div>
    <div class="summary-box">
      <div class="val val-win" id="s-win">0</div>
      <div class="lbl">的中</div>
    </div>
    <div class="summary-box">
      <div class="val val-rate" id="s-rate">—</div>
      <div class="lbl">的中率</div>
    </div>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>記録を編集</h3>
      <button class="modal-close" onclick="closeEdit()">✕</button>
    </div>
    <div class="row2">
      <div class="field">
        <label class="field-label">競馬場</label>
        <div class="select-wrap">
          <select id="e-track">
            <option>東京</option><option>中山</option><option>京都</option><option>阪神</option>
            <option>中京</option><option>小倉</option><option>新潟</option><option>福島</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">距離</label>
        <div class="select-wrap">
          <select id="e-distance">
            <optgroup label="芝">
              <option>芝1000m</option><option>芝1200m</option><option>芝1400m</option>
              <option>芝1500m</option><option>芝1600m</option><option>芝1700m</option>
              <option>芝1800m</option><option>芝2000m</option><option>芝2200m</option>
              <option>芝2400m</option><option>芝2500m</option><option>芝2600m</option>
              <option>芝3000m</option><option>芝3200m</option><option>芝3400m</option>
              <option>芝3600m</option>
            </optgroup>
            <optgroup label="ダート">
              <option>ダ1000m</option><option>ダ1150m</option><option>ダ1200m</option>
              <option>ダ1300m</option><option>ダ1400m</option><option>ダ1600m</option>
              <option>ダ1700m</option><option>ダ1800m</option><option>ダ1900m</option>
              <option>ダ2000m</option><option>ダ2100m</option><option>ダ2400m</option>
              <option>ダ2500m</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">馬券種</label>
      <div class="bet-chips">
        <div class="bet-chip"><input type="checkbox" id="e-tan"><label for="e-tan">単勝</label></div>
        <div class="bet-chip"><input type="checkbox" id="e-fuku"><label for="e-fuku">複勝</label></div>
        <div class="bet-chip"><input type="checkbox" id="e-wide"><label for="e-wide">ワイド</label></div>
        <div class="bet-chip"><input type="checkbox" id="e-uma"><label for="e-uma">馬連</label></div>
        <div class="bet-chip"><input type="checkbox" id="e-sanren"><label for="e-sanren">三連複</label></div>
        <div class="bet-chip"><input type="checkbox" id="e-santan"><label for="e-santan">三連単</label></div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">馬名</label>
      <input type="text" id="e-horse" placeholder="例：イクイノックス">
    </div>
    <div class="field">
      <label class="field-label">購入根拠</label>
      <textarea id="e-reason" rows="2"></textarea>
    </div>
    <div class="field">
      <label class="field-label">的中 / 不的中</label>
      <div class="result-radio">
        <input type="radio" name="e-result" id="e-win" class="r-win" value="的中">
        <label for="e-win">✓ 的中</label>
        <input type="radio" name="e-result" id="e-lose" class="r-lose" value="不的中">
        <label for="e-lose">✗ 不的中</label>
      </div>
    </div>
    <div class="field">
      <label class="field-label">着順</label>
      <div class="select-wrap">
        <select id="e-finishing">
          <option value="">—</option>
          <option>1着</option><option>2着</option><option>3着</option>
          <option>4着</option><option>5着</option><option>6着</option>
          <option>7着</option><option>8着</option><option>9着</option>
          <option>10着</option><option>11着以下</option><option>中止・除外</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label class="field-label">敗因</label>
      <textarea id="e-failure" rows="2"></textarea>
    </div>
    <button class="btn-primary" onclick="saveEdit()">変更を保存する</button>
  </div>
</div>

<!-- 削除確認モーダル -->
<div class="confirm-overlay" id="confirm-modal">
  <div class="confirm-modal">
    <h3>記録を削除しますか？</h3>
    <p>削除した記録は元に戻せません。</p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="btn-danger" onclick="confirmDelete()">削除する</button>
    </div>
  </div>
</div>

<script>
/* ── データ管理 ───────────────────────────────── */
const KEY = 'raceRecords_v6';
const BET_MAP = {
  'c-tan':'単勝','c-fuku':'複勝','c-wide':'ワイド',
  'c-uma':'馬連','c-sanren':'三連複','c-santan':'三連単'
};
const EDIT_MAP = {
  'e-tan':'単勝','e-fuku':'複勝','e-wide':'ワイド',
  'e-uma':'馬連','e-sanren':'三連複','e-santan':'三連単'
};

function load() {
  return JSON.parse(localStorage.getItem(KEY) || '[]');
}
function save(records) {
  localStorage.setItem(KEY, JSON.stringify(records));
}

/* ── タブ ─────────────────────────────────────── */
function switchTab(tab) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'history') renderHistory();
}

/* ── 記録保存 ─────────────────────────────────── */
function saveRecord() {
  const bets = Object.entries(BET_MAP)
    .filter(([id]) => document.getElementById(id).checked)
    .map(([,label]) => label);

  if (bets.length === 0) { showToast('馬券種を選択してください', true); return; }

  const rec = {
    id: Date.now(),
    track: document.getElementById('track').value,
    distance: document.getElementById('distance').value,
    bets,
    horse: document.getElementById('horse').value,
    finishing: document.getElementById('finishing').value,
    reason: document.getElementById('reason').value,
    result: document.querySelector('input[name="result"]:checked').value,
    failure: document.getElementById('failure').value
  };

  const recs = load();
  recs.unshift(rec);
  save(recs);

  // リセット
  Object.keys(BET_MAP).forEach(id => document.getElementById(id).checked = false);
  document.getElementById('horse').value = '';
  document.getElementById('finishing').value = '';
  document.getElementById('reason').value = '';
  document.getElementById('failure').value = '';
  document.getElementById('r-win').checked = true;

  updateBadge();
  showToast('記録を保存しました');
}

/* ── 履歴レンダリング ─────────────────────────── */
function renderHistory() {
  const recs = load();
  const list = document.getElementById('history-list');
  const wins = recs.filter(r => r.result === '的中').length;

  document.getElementById('s-total').textContent = recs.length;
  document.getElementById('s-win').textContent = wins;
  document.getElementById('s-rate').textContent =
    recs.length ? Math.round(wins / recs.length * 100) + '%' : '—';

  if (recs.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>まだ記録がありません。<br>「記録する」タブから追加しましょう。</p>
      </div>`;
    return;
  }

  list.innerHTML = recs.map(r => `
    <div class="h-card" data-id="${r.id}">
      <div class="h-card-inner">
        <div class="h-card-top">
          <div>
            <div class="h-track">${r.track}</div>
            <div class="h-dist">${r.distance}</div>
          </div>
          <div class="h-badges">
            ${r.bets.map(b => `<span class="badge badge-bet">${b}</span>`).join('')}
            <span class="badge ${r.result === '的中' ? 'badge-win' : 'badge-lose'}">${r.result}</span>
          </div>
        </div>
        ${(r.horse || r.finishing) ? `
          <div class="h-horse-row">
            ${r.horse ? `<span class="h-horse-name">🐴 ${esc(r.horse)}</span>` : ''}
            ${r.finishing ? `<span class="h-finishing">${r.finishing}</span>` : ''}
          </div>` : ''}
        ${r.reason ? `<div class="h-reason">📝 ${esc(r.reason)}</div>` : ''}
        ${r.failure ? `<div class="h-failure">⚠ ${esc(r.failure)}</div>` : ''}
      </div>
      <div class="h-actions">
        <button class="h-action-btn edit" onclick="openEdit(${r.id})">✎ 編集</button>
        <div class="h-action-sep"></div>
        <button class="h-action-btn del" onclick="openConfirm(${r.id})">✕ 削除</button>
      </div>
    </div>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateBadge() {
  const n = load().length;
  document.getElementById('count-badge').textContent = n ? `(${n})` : '';
}

/* ── 編集 ─────────────────────────────────────── */
let editingId = null;

function openEdit(id) {
  const recs = load();
  const r = recs.find(x => x.id === id);
  if (!r) return;
  editingId = id;

  document.getElementById('e-track').value    = r.track;
  document.getElementById('e-distance').value = r.distance;
  Object.entries(EDIT_MAP).forEach(([eid, label]) => {
    document.getElementById(eid).checked = r.bets.includes(label);
  });
  document.getElementById('e-horse').value     = r.horse || '';
  document.getElementById('e-finishing').value = r.finishing || '';
  document.getElementById('e-reason').value    = r.reason || '';
  document.getElementById('e-failure').value   = r.failure || '';
  if (r.result === '的中') document.getElementById('e-win').checked = true;
  else document.getElementById('e-lose').checked = true;

  document.getElementById('edit-modal').classList.add('open');
}

function closeEdit() {
  document.getElementById('edit-modal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  if (editingId === null) return;
  const bets = Object.entries(EDIT_MAP)
    .filter(([id]) => document.getElementById(id).checked)
    .map(([,label]) => label);
  if (bets.length === 0) { showToast('馬券種を選択してください', true); return; }

  const recs = load();
  const idx  = recs.findIndex(r => r.id === editingId);
  if (idx === -1) return;

  recs[idx] = {
    ...recs[idx],
    track:     document.getElementById('e-track').value,
    distance:  document.getElementById('e-distance').value,
    bets,
    horse:     document.getElementById('e-horse').value,
    finishing: document.getElementById('e-finishing').value,
    reason:    document.getElementById('e-reason').value,
    result:    document.querySelector('input[name="e-result"]:checked').value,
    failure:   document.getElementById('e-failure').value
  };
  save(recs);
  closeEdit();
  renderHistory();
  updateBadge();
  showToast('変更を保存しました');
}

/* ── 削除 ─────────────────────────────────────── */
let deletingId = null;

function openConfirm(id) {
  deletingId = id;
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
  deletingId = null;
}
function confirmDelete() {
  if (deletingId === null) return;
  const recs = load().filter(r => r.id !== deletingId);
  save(recs);
  closeConfirm();
  renderHistory();
  updateBadge();
  showToast('削除しました');
}

/* ── トースト ─────────────────────────────────── */
function showToast(msg, isError = false) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', bottom: '20px', left: '50%',
    transform: 'translateX(-50%)',
    background: isError ? '#C0392B' : '#1A2F45',
    color: '#FFFFFF',
    padding: '10px 22px', borderRadius: '20px',
    fontSize: '0.85rem', fontWeight: '700',
    zIndex: '999', whiteSpace: 'nowrap',
    boxShadow: '0 4px 16px rgba(0,0,0,0.4)',
    animation: 'fadeUp .3s ease'
  });
  const style = document.createElement('style');
  style.textContent = '@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
  document.head.appendChild(style);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ── 初期化 ───────────────────────────────────── */
window.onload = updateBadge;

// モーダル外クリックで閉じる
document.getElementById('edit-modal').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});
document.getElementById('confirm-modal').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});
</script>
</body>
</html>
