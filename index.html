<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競馬投資管理ツール v5</title>
    <style>
        :root { --primary: #28a745; --bg: #f8f9fa; --border: #ddd; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: var(--bg); max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-size: 0.85em; color: #555; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        /* 統一された馬券種ボタン */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-check { display: none; }
        .btn-label { display: block; padding: 12px; border: 1px solid var(--border); border-radius: 8px; text-align: center; cursor: pointer; background: white; transition: 0.2s; }
        .btn-check:checked + .btn-label { background: var(--primary); color: white; border-color: var(--primary); }

        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 25px; }
        .history-item { font-size: 0.85em; border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h3>投資記録</h3>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label>競馬場</label>
            <select id="track">
                <option>東京</option><option>中山</option><option>京都</option><option>阪神</option>
                <option>中京</option><option>小倉</option><option>新潟</option><option>福島</option>
            </select>
        </div>
        <div>
            <label>距離</label>
            <select id="distance">
                <option>1200m</option><option>1400m</option><option>1600m</option>
                <option>1800m</option><option>2000m</option><option>2400m</option>
            </select>
        </div>
    </div>

    <label>馬券種</label>
    <div class="btn-group">
        <input type="checkbox" id="tan" class="btn-check">
        <label for="tan" class="btn-label">単勝</label>
        
        <input type="checkbox" id="fuku" class="btn-check">
        <label for="fuku" class="btn-label">複勝</label>
    </div>

    <label>購入根拠</label>
    <textarea id="reason" rows="2" placeholder="根拠を入力"></textarea>

    <label>結果</label>
    <select id="result">
        <option>的中</option>
        <option>不的中</option>
    </select>

    <label>敗因・反省</label>
    <textarea id="failureReason" rows="3" placeholder="外れた場合のみ記入"></textarea>

    <button onclick="saveData()">記録する</button>
</div>

<div class="card">
    <h3>履歴</h3>
    <div id="history"></div>
</div>

<script>
    function loadRecords() {
        const historyDiv = document.getElementById('history');
        const records = JSON.parse(localStorage.getItem('raceRecords') || '[]');
        historyDiv.innerHTML = records.map(r => `
            <div class="history-item">
                <strong>${r.track} ${r.distance}</strong> (${r.result})<br>
                ${r.bets.join('・')}<br>
                <small style="color:#777">根拠: ${r.reason}</small><br>
                <small style="color:#d9534f">反省: ${r.failure}</small>
            </div>
        `).join('');
    }

    function saveData() {
        const bets = [];
        if(document.getElementById('tan').checked) bets.push('単勝');
        if(document.getElementById('fuku').checked) bets.push('複勝');
        
        if(bets.length === 0) { alert('馬券種を選択してください'); return; }

        const data = {
            track: document.getElementById('track').value,
            distance: document.getElementById('distance').value,
            bets: bets,
            reason: document.getElementById('reason').value,
            result: document.getElementById('result').value,
            failure: document.getElementById('failureReason').value
        };
        
        let records = JSON.parse(localStorage.getItem('raceRecords') || '[]');
        records.unshift(data);
        localStorage.setItem('raceRecords', JSON.stringify(records));
        
        alert('保存しました！');
        location.reload(); // フォームをリセット
    }
    window.onload = loadRecords;
</script>
</body>
</html>
